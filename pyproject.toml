[project]
name = "gridiron-ai"
version = "0.1.0"
description = "Sleeper-centric AI fantasy football copilot (GridironAI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "greenlet>=3.1.0",
  "pulp>=2.9.0",
  "openai>=1.60.0",
  "langgraph>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps"]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["apps/backend"]
asyncio_mode = "auto"
testpaths = ["apps/backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
